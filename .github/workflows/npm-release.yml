name: Release to npm

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Build binaries and publish to npm
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          declare -A TARGETS=(
            ["linux-x64"]="linux amd64"
            ["darwin-x64"]="darwin amd64"
            ["darwin-arm64"]="darwin arm64"
            ["win32-x64"]="windows amd64"
          )

          for PKG in "${!TARGETS[@]}"; do
            read -r GOOS GOARCH <<< "${TARGETS[$PKG]}"
            mkdir -p "npm/nimble-cli-${PKG}/bin"
            EXT=$([[ "$GOOS" == "windows" ]] && echo ".exe" || echo "")
            GOOS=$GOOS GOARCH=$GOARCH go build \
              -ldflags "-X main.version=${VERSION}" \
              -o "npm/nimble-cli-${PKG}/bin/nimble${EXT}" \
              ./cmd/nimble
            # Make binary executable
            chmod +x "npm/nimble-cli-${PKG}/bin/nimble${EXT}" 2>/dev/null || true
            # Update version in package.json
            jq --arg v "$VERSION" '.version = $v' \
              "npm/nimble-cli-${PKG}/package.json" > tmp.json \
              && mv tmp.json "npm/nimble-cli-${PKG}/package.json"
          done

          # Update main package: version + all optional dependency versions
          jq --arg v "$VERSION" \
            '.version = $v | .optionalDependencies |= with_entries(.value = $v)' \
            npm/nimble-cli/package.json > tmp.json \
            && mv tmp.json npm/nimble-cli/package.json

          # Publish platform packages first, then the main wrapper
          for dir in npm/nimble-cli-*/; do
            npm publish "$dir" --access public
          done
          npm publish npm/nimble-cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
