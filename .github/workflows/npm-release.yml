name: Release to npm

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          jq --arg v "$VERSION" '.version = $v' \
            npm/nimble-cli/package.json > tmp.json \
            && mv tmp.json npm/nimble-cli/package.json

          npm publish ./npm/nimble-cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
